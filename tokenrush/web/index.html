<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Rush</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vscode/codicons@0.0.36/dist/codicon.css">
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #121410;
    --side: #1b1e18;
    --line: #2c3128;
    --text: #e7e4da;
    --muted: #8d8a7e;
    --user: #262a22;
    --accent: #d6a15c;
    --danger: #c46b55;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    display: flex;
    min-height: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 "Iowan Old Style", Palatino, "Songti SC", serif;
  }
  aside {
    width: 260px;
    flex: none;
    background: var(--side);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  header.side, .composer {
    padding: 14px;
    border-bottom: 1px solid var(--line);
  }
  .composer { border-bottom: 0; border-top: 1px solid var(--line); }
  button, textarea, input[type="range"] { font: inherit; color: inherit; }
  button {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: var(--accent); color: #1a140c; border-color: var(--accent); }
  button.danger { color: var(--danger); }
  #new { width: 100%; }
  footer.side {
    flex: none;
    border-top: 1px solid var(--line);
    padding: 12px 14px;
  }
  header.bar {
    flex: none;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    height: 40px;
    font-family: "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", sans-serif;
    font-size: 13px;
  }
  header.bar .modes { display: flex; gap: 4px; }
  header.bar button {
    border: 0;
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 12px;
  }
  header.bar button.on { color: var(--text); background: var(--user); }
  header.bar button:hover { color: var(--text); border: 0; }
  #mode-fold { justify-self: end; margin-right: 8px; width: 28px; height: 28px; padding: 0; }
  #mode-unfold {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 4;
    height: 22px; padding: 0 10px; border-radius: 999px;
    background: var(--side); border: 1px solid var(--line); color: var(--muted);
    font-family: "Noto Sans CJK SC", "Noto Sans SC", sans-serif; font-size: 12px;
  }
  #log[hidden], .composer[hidden], #ide[hidden], aside[hidden], #editor[hidden], #monaco[hidden], #pane-files[hidden], #pane-search[hidden], #code-row[hidden], #mode-bar[hidden], #mode-unfold[hidden] { display: none !important; }
  #code-row { flex: 1; min-height: 0; display: flex; }
  #vscode-frame { flex: 1; min-width: 0; min-height: 0; border: 0; background: #1e1e1e; }
  #code-split { width: 6px; flex: none; cursor: col-resize; background: #2b2b2b; }
  #code-split:hover, body.col-drag #code-split { background: #0e639c; }
  body.col-drag { cursor: col-resize; user-select: none; }
  body.col-drag iframe { pointer-events: none; }
  #code-chat {
    width: 360px; flex: none; min-width: 260px; min-height: 0; display: flex; flex-direction: column;
    background: #1e1e1e; color: #d4d4d4;
    font-family: "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", sans-serif;
    font-size: 13px; line-height: 1.45;
  }
  #code-chat header { flex: none; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #ccc; font-size: 13px; }
  #code-folder {
    margin-left: auto; min-width: 0; max-width: 58%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: #8a8a8a; font-size: 11px;
  }
  #code-status { color: #d6a15c; font-size: 12px; }
  #code-status:empty { display: none; }
  #code-status::before {
    content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px;
    border-radius: 50%; background: #d6a15c; vertical-align: middle;
    animation: code-pulse 1s ease-in-out infinite;
  }
  @keyframes code-pulse { 50% { opacity: 0.25; } }
  #code-log { flex: 1; overflow: auto; padding: 4px 14px 12px; }
  #code-log .empty { color: #8a8a8a; }
  #code-log .turn { margin: 0 0 16px; }
  #code-log .who { font-size: 11px; color: #8a8a8a; margin-bottom: 4px; }
  #code-log .text { white-space: pre-wrap; word-break: break-word; }
  #code-log .turn.assistant .text { white-space: normal; }
  #code-log .steps { color: #8a8a8a; font-size: 12px; margin-bottom: 6px; }
  #code-log .steps:empty { display: none; }
  #code-log .turn.user { display: flex; flex-direction: column; align-items: flex-end; }
  #code-log .turn.user .bubble {
    max-width: 100%; background: #34362f; border-radius: 12px 12px 4px 12px; padding: 8px 10px; color: #f2f0e8;
  }
  #code-log .turn.assistant .text { color: #c8c8c8; }
  #code-log .turn.assistant.live .text:empty::before { content: "正在回复"; color: #8a8a8a; }
  #code-log .turn.assistant.live .text::after {
    content: ""; display: inline-block; width: 7px; height: 13px; margin-left: 3px;
    background: #d6a15c; vertical-align: text-bottom; animation: code-blink 1s steps(1) infinite;
  }
  @keyframes code-blink { 50% { opacity: 0; } }
  #code-log .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  #code-send.busy { background: #3c3c3c; color: #d6a15c; }
  #code-chat form {
    position: relative; margin: 8px; padding: 8px 8px 36px;
    border: 1px solid #3c3c3c; border-radius: 12px; background: #252526;
  }
  #code-chat form:focus-within { border-color: #555; }
  #code-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  #code-chips:empty { display: none; }
  #code-chips:not(:empty) { margin-bottom: 6px; }
  #code-chat .chip, #code-log .pill {
    border: 1px solid #3c3c3c; background: #2a2a2a; border-radius: 999px;
    padding: 1px 8px; font-family: ui-monospace, monospace; font-size: 12px; color: #ddd;
  }
  #code-chat .chip button { border: 0; background: transparent; color: #aaa; padding: 0 0 0 4px; border-radius: 999px; }
  #code-box { width: 100%; height: 52px; resize: none; background: transparent; color: #eee; border: 0; padding: 2px 4px; font: inherit; }
  #code-box:focus { outline: none; }
  #code-send {
    position: absolute; right: 8px; bottom: 8px; width: 26px; height: 26px; padding: 0;
    border: 0; border-radius: 999px; background: #e7e4da; color: #1a140c;
  }
  #code-send:disabled { opacity: 0.4; }
  #ide {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: #1e1e1e; color: #cccccc;
    font-family: "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
  }
  .ide-bar {
    flex: none; display: flex; align-items: center; gap: 4px;
    height: 36px; padding: 0 8px; background: #252526;
    border-bottom: 1px solid #333; font-size: 13px;
  }
  .ide-bar button, .activity button, .tabs button, .tree button, #search-hits button {
    border: 0; background: transparent; color: inherit; border-radius: 4px; padding: 4px;
  }
  .ide-bar button:hover, .activity button:hover, .tabs button:hover, .tree button:hover { background: #2a2d2e; }
  #crumbs { flex: 1; display: flex; align-items: center; gap: 2px; overflow: hidden; min-width: 0; }
  #crumbs button { padding: 2px 4px; color: #ccc; }
  #crumbs .sep { color: #666; }
  #ide-who { color: #888; margin-left: 8px; }
  .ide-body { flex: 1; min-height: 0; display: flex; }
  .activity { width: 48px; flex: none; background: #333333; display: flex; flex-direction: column; align-items: center; padding-top: 6px; gap: 2px; }
  .activity button { width: 48px; height: 48px; border-radius: 0; color: #858585; font-size: 24px; }
  .activity button.on { color: #fff; border-left: 2px solid #fff; }
  .sidepane { width: 260px; flex: none; display: flex; flex-direction: column; min-height: 0; background: #252526; border-right: 1px solid #333; }
  #pane-files, #pane-search { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .pane-title { flex: none; padding: 8px 12px 4px; font-size: 11px; letter-spacing: 0.04em; color: #bbb; }
  .tree, #search-hits { flex: 1; overflow: auto; padding: 4px 0 8px; font-size: 13px; }
  .tree button, #search-hits button {
    display: flex; align-items: center; gap: 4px; width: 100%; text-align: left;
    border-radius: 0; padding-top: 2px; padding-bottom: 2px; font-size: 13px;
  }
  .tree button.on, #search-hits button.on { background: #37373d; }
  .tree .codicon, #search-hits .codicon { flex: none; font-size: 16px; }
  .tree .twist { width: 16px; }
  #file-search { margin: 4px 8px 8px; width: calc(100% - 16px); background: #3c3c3c; color: inherit; border: 1px solid #3c3c3c; border-radius: 2px; padding: 4px 6px; font-size: 13px; }
  .editor-wrap { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .tabs { flex: none; display: flex; height: 35px; background: #252526; overflow: auto; }
  .tabs button { display: flex; align-items: center; gap: 6px; height: 35px; padding: 0 10px; border-right: 1px solid #252526; border-radius: 0; color: #969696; white-space: nowrap; }
  .tabs button.on { background: #1e1e1e; color: #fff; }
  .tabs .codicon-close { font-size: 14px; opacity: 0.7; }
  #monaco, #editor { flex: 1; min-height: 0; width: 100%; }
  #editor {
    resize: none; border: 0; outline: none;
    background: #1e1e1e; color: #d4d4d4;
    font: 14px/1.55 ui-monospace, "Sarasa Mono SC", monospace;
    padding: 12px 16px;
  }
  .vibe { width: 360px; flex: none; display: flex; flex-direction: column; border-left: 1px solid #333; border-right: 0; background: #1e1e1e; }
  #vibe-log { flex: 1; min-height: 0; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  #vibe-log .who { color: #888; font-size: 12px; }
  #vibe-log .tool { color: #888; font-size: 12px; }
  #vibe-box { width: 100%; resize: none; min-height: 64px; background: #252526; color: inherit; border-color: #333; font-size: 14px; }
  .picker {
    position: absolute; inset: 48px 8vw auto; z-index: 4;
    background: #252526; border: 1px solid #444; border-radius: 10px;
    padding: 12px; max-height: 70%; display: flex; flex-direction: column; gap: 8px;
  }
  .picker[hidden] { display: none !important; }
  #picker-list { overflow: auto; min-height: 0; }
  #ide { position: relative; }
  #list { overflow: auto; flex: 1; padding: 8px; }
  .chat {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    text-align: left;
    border: 0;
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 4px;
    background: transparent;
  }
  .chat.on { background: var(--user); }
  .chat span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat .x { border: 0; padding: 0 4px; color: var(--muted); }
  main { position: relative; flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  #log {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 28px 8vw 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .composer { flex: none; }
  .bubble { max-width: min(760px, 100%); word-break: break-word; }
  .bubble.user {
    align-self: flex-end;
    background: var(--user);
    border-radius: 12px;
    padding: 10px 14px;
    white-space: pre-wrap;
  }
  .bubble.assistant {
    align-self: flex-start;
    max-width: min(920px, 100%);
    font-family: "Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    white-space: normal;
  }
  .think, .status { color: var(--muted); font-size: 14px; margin-bottom: 6px; white-space: pre-wrap; }
  .banner { color: var(--muted); font-size: 14px; white-space: pre-wrap; border-left: 2px solid var(--accent); padding-left: 10px; }
  .status.wait::after {
    content: "";
    animation: waitdots 1.2s steps(4, end) infinite;
  }
  @keyframes waitdots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
  }
  details.searches { margin-top: 8px; }
  details.searches summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  details.searches .hit { margin: 6px 0 0 12px; }
  details.searches .q { color: var(--muted); font-size: 13px; }
  details.searches a { color: var(--accent); font-size: 14px; display: block; margin-top: 2px; }
  .md :is(h1, h2, h3, h4) { font-weight: 650; line-height: 1.35; margin: 1.15em 0 0.4em; }
  .md h1 { font-size: 1.28em; }
  .md h2 { font-size: 1.14em; }
  .md h3 { font-size: 1.05em; }
  .md h4 { font-size: 1em; }
  .md :is(h1, h2, h3, h4):first-child { margin-top: 0; }
  .md p { margin: 0.55em 0; }
  .md p:first-child { margin-top: 0; }
  .md p:last-child { margin-bottom: 0; }
  .md ul, .md ol { margin: 0.4em 0; padding-left: 1.35em; }
  .md li { margin: 0.15em 0; }
  .md blockquote { margin: 0.6em 0; padding: 2px 0 2px 12px; border-left: 2px solid var(--line); color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
  .md a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
  .md a:hover { text-decoration: underline; }
  .md code, pre code {
    font-family: "Noto Sans Mono CJK SC", ui-monospace, "Sarasa Mono SC", monospace;
  }
  .md code {
    font-size: 0.88em;
    background: #1c211b;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 5px;
  }
  pre {
    font-family: "Noto Sans Mono CJK SC", ui-monospace, "Sarasa Mono SC", monospace;
    background: #0e100d;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    overflow: auto;
    font-size: 13.5px;
    line-height: 1.5;
    margin: 0.7em 0;
    white-space: pre;
  }
  pre .lang { color: var(--muted); font-size: 12px; margin-bottom: 6px; font-family: "Noto Sans CJK SC", sans-serif; }
  pre code { background: none; border: 0; padding: 0; font-size: 13.5px; }
  .table-wrap { overflow-x: auto; margin: 0.7em 0 1em; }
  .md table { border-collapse: collapse; width: max-content; max-width: 100%; font-size: 14.5px; line-height: 1.45; }
  .md th, .md td { border: 1px solid var(--line); padding: 7px 12px; vertical-align: top; }
  .md th { background: #1c211b; font-weight: 650; text-align: left; }
  .md tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.03); }
  .math, .math-block { font-family: ui-monospace, monospace; }
  .math-block { display: block; margin: 0.7em 0; overflow-x: auto; }
  img.fig { max-width: min(100%, 480px); max-height: 320px; border-radius: 8px; display: block; margin: 8px 0; }
  .empty { color: var(--muted); margin: auto; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: var(--muted); font-size: 14px; }
  .row label { display: flex; align-items: center; gap: 6px; }
  textarea {
    width: 100%;
    resize: none;
    min-height: 52px;
    max-height: 200px;
    background: var(--side);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .actions { display: flex; justify-content: flex-end; align-items: center; margin-top: 8px; }
  #sendstop { display: flex; gap: 8px; }
  #who { color: var(--muted); font-size: 13px; }
  #gate {
    position: fixed;
    inset: 0;
    z-index: 5;
    background: rgba(18, 20, 16, 0.94);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #gate[hidden] { display: none; }
  #gate form {
    width: min(380px, 92vw);
    background: var(--side);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #gatewho, #gateerr { margin: 0; line-height: 1.5; }
  #gateerr { color: var(--danger); min-height: 1.2em; }
  #gate input {
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
  }
</style>
</head>
<body>
<aside>
  <header class="side">
    <button id="new" type="button">新对话</button>
  </header>
  <div id="list"></div>
  <footer class="side"><div id="who"></div></footer>
</aside>
<div id="gate" hidden>
  <form id="gateform">
    <p id="gatewho"></p>
    <input id="gatepw" type="password" placeholder="密码" autocomplete="current-password">
    <button class="primary" type="submit">进入</button>
    <p id="gateerr"></p>
  </form>
</div>
<main>
  <header class="bar" id="mode-bar">
    <span></span>
    <div class="modes">
      <button id="mode-chat" class="on" type="button">对话</button>
      <button id="mode-code" type="button">写代码</button>
    </div>
    <button id="mode-fold" type="button" title="收起"><i class="codicon codicon-chevron-up"></i></button>
  </header>
  <button id="mode-unfold" type="button" hidden title="展开">对话 / 写代码</button>
  <div id="code-row" hidden>
    <iframe id="vscode-frame" title="VS Code"></iframe>
    <div id="code-split" title="拖动调整宽度"></div>
    <section id="code-chat">
      <header><span>token-rush</span><span id="code-status"></span><span id="code-folder"></span></header>
      <div id="code-log"><div class="empty">选中代码，右键「把选中代码加入 token-rush」。选中终端输出，右键「把选中输出加入 token-rush」。引用显示成 文件:行号。</div></div>
      <form id="code-form">
        <div id="code-chips"></div>
        <textarea id="code-box" placeholder="问点什么"></textarea>
        <button id="code-send" type="submit" title="发送"><i class="codicon codicon-arrow-up"></i></button>
      </form>
    </section>
  </div>
  <div id="ide" hidden>
    <div class="ide-bar">
      <button id="open-dir" type="button" title="打开目录"><i class="codicon codicon-folder-opened"></i></button>
      <nav id="crumbs"></nav>
      <button id="save-file" type="button" title="保存"><i class="codicon codicon-save"></i></button>
      <span id="ide-who"></span>
    </div>
    <div class="ide-body">
      <div class="activity">
        <button id="act-files" class="on" type="button" title="资源管理器"><i class="codicon codicon-files"></i></button>
        <button id="act-search" type="button" title="搜索"><i class="codicon codicon-search"></i></button>
      </div>
      <div class="sidepane">
        <div id="pane-files">
          <div class="pane-title">资源管理器</div>
          <div class="tree" id="tree"></div>
        </div>
        <div id="pane-search" hidden>
          <div class="pane-title">搜索</div>
          <input id="file-search" placeholder="按文件名搜索" autocomplete="off">
          <div id="search-hits"></div>
        </div>
      </div>
      <div class="editor-wrap">
        <div class="tabs" id="tabs"></div>
        <div id="monaco" hidden></div>
        <textarea id="editor" spellcheck="false" placeholder="从左侧打开一个文件"></textarea>
      </div>
      <aside class="vibe">
        <div id="vibe-log"><div class="empty">说一句话，让它改这个目录里的文件</div></div>
        <form id="vibe-form" class="composer">
          <textarea id="vibe-box" rows="2" placeholder="改代码或写文档，Enter 发送"></textarea>
          <div class="actions"><button id="vibe-send" class="primary" type="submit">发送</button></div>
        </form>
      </aside>
    </div>
    <div id="picker" class="picker" hidden>
      <div id="picker-path"></div>
      <div id="picker-list"></div>
      <div class="actions">
        <button id="picker-up" type="button">上级</button>
        <button id="picker-open" class="primary" type="button">在此打开</button>
        <button id="picker-close" type="button">取消</button>
      </div>
    </div>
  </div>
  <div id="log"><div class="empty">开始一段对话</div></div>
  <form class="composer" id="form">
    <div class="row">
      <label>温度 <input id="temp" type="range" min="0" max="1" step="0.1" value="0.7"></label>
      <span id="tempv">0.7</span>
      <label><input id="think" type="checkbox"> 思考</label>
    </div>
    <textarea id="box" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <div class="actions">
      <div id="sendstop">
        <button id="stop" type="button" disabled>停止</button>
        <button id="send" class="primary" type="submit">发送</button>
      </div>
    </div>
  </form>
</main>
<script>
const log = document.getElementById("log")
const list = document.getElementById("list")
const box = document.getElementById("box")
const sendBtn = document.getElementById("send")
const stopBtn = document.getElementById("stop")
const temp = document.getElementById("temp")
const tempv = document.getElementById("tempv")
const think = document.getElementById("think")
const who = document.getElementById("who")
const gate = document.getElementById("gate")
const gatewho = document.getElementById("gatewho")
const gatepw = document.getElementById("gatepw")
const gateerr = document.getElementById("gateerr")

let topP = 0.9
let seated = false
let catalog = []
let current = null
let messages = []
let live = { content: "", reasoning: "", query: "" }
let busy = false
let ctrl = null
let saveOnAbort = false

temp.value = localStorage.getItem("tokenrush.temperature") || "0.7"
think.checked = localStorage.getItem("tokenrush.think") === "1"
tempv.textContent = Number(temp.value).toFixed(1)
temp.addEventListener("input", () => {
  tempv.textContent = Number(temp.value).toFixed(1)
  localStorage.setItem("tokenrush.temperature", temp.value)
})
think.addEventListener("change", () => localStorage.setItem("tokenrush.think", think.checked ? "1" : "0"))

function searchItems(i) {
  const items = []
  for (let j = i - 1; j >= 0; j--) {
    const m = messages[j]
    if (m.role === "user") break
    if (m.role !== "tool") continue
    let query = ""
    for (let k = j - 1; k >= 0 && messages[k].role !== "user"; k--) {
      const calls = messages[k].tool_calls || []
      const call = calls.find(c => c.id && c.id === m.tool_call_id) || calls[0]
      if (messages[k].role === "assistant" && call && call.function) {
        try {
          const args = JSON.parse(call.function.arguments || "{}")
          query = args.query || args.url || ""
        } catch (e) {
          query = ""
        }
        break
      }
    }
    const links = (m.sources && m.sources.length) ? m.sources.slice(0, 5) : firstLinks(m.content)
    items.push({ name: m.name || "", query, links })
  }
  return items.reverse()
}

function firstLinks(content) {
  const out = []
  for (const u of ((content || "").match(/https:\/\/[^\s<>)\]]+/g) || [])) {
    if (out.some(x => x.url === u)) continue
    out.push({ title: u.replace(/^https:\/\//, "").slice(0, 48), url: u })
    if (out.length >= 5) break
  }
  return out
}

function isFinalAnswer(i) {
  for (let j = i + 1; j < messages.length; j++) {
    if (messages[j].role === "user") break
    if (messages[j].role === "assistant" && (messages[j].content || messages[j].reasoning)) return false
  }
  return true
}

function stripUrlWall(text) {
  const kept = (text || "").split("\n").filter(line => !/^https?:\/\/\S+$/.test(line.trim()))
  return kept.join("\n").replace(/\n{3,}/g, "\n\n").trim()
}

function renderLog() {
  log.replaceChildren()
  const shown = messages.filter(m => m.role === "user" || (m.role === "assistant" && (m.content || m.reasoning)))
  if (!shown.length && !live.content && !live.reasoning && !live.query) {
    const e = document.createElement("div")
    e.className = "empty"
    e.textContent = "开始一段对话"
    log.append(e)
    return
  }
  messages.forEach((m, i) => {
    if (m.role === "tool") return
    if (m.role === "assistant" && !m.content && !m.reasoning) return
    appendBubble(m.role, m.content, m.reasoning, m.role === "assistant" && isFinalAnswer(i) ? searchItems(i) : [], "")
  })
  if (busy) {
    const waiting = !live.content && !live.reasoning && !live.query
    appendBubble("assistant", live.content, live.reasoning, searchItems(messages.length), waiting ? "思考中" : live.query)
  }
  log.scrollTop = log.scrollHeight
}

function appendBubble(role, content, reasoning, urls, status) {
  const el = document.createElement("div")
  el.className = "bubble " + (role === "user" ? "user" : "assistant")
  if (status) {
    const s = document.createElement("div")
    s.className = "status" + (status === "思考中" ? " wait" : "")
    s.textContent = status
    el.append(s)
  }
  if (role !== "user" && reasoning) {
    const t = document.createElement("div")
    t.className = "think"
    t.textContent = reasoning
    el.append(t)
  }
  const body = document.createElement("div")
  if (role === "user") body.textContent = content || ""
  else {
    body.className = "md"
    renderRich(body, stripUrlWall(content || ""))
  }
  el.append(body)
  if (urls && urls.length) el.append(searchBox(urls))
  log.append(el)
}

function searchBox(items) {
  const box = document.createElement("details")
  box.className = "searches"
  const summary = document.createElement("summary")
  summary.textContent = "搜索 " + items.length + " 次"
  box.append(summary)
  for (const item of items) {
    const hit = document.createElement("div")
    hit.className = "hit"
    if (item.query) {
      const q = document.createElement("div")
      q.className = "q"
      q.textContent = (item.name === "web_fetch" ? "打开 " : item.name === "recall" ? "查找 " : "搜索 ") + item.query
      hit.append(q)
    }
    for (const link of item.links || []) {
      const a = document.createElement("a")
      a.href = link.url
      a.target = "_blank"
      a.rel = "noopener"
      a.textContent = link.title || link.url
      hit.append(a)
    }
    box.append(hit)
  }
  return box
}

function renderRich(parent, text) {
  const lines = text.replace(/\r\n/g, "\n").split("\n")
  let i = 0
  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim()) { i++; continue }
    if (line.startsWith("```")) {
      const lang = line.slice(3).trim()
      const buf = []
      i++
      while (i < lines.length && !lines[i].startsWith("```")) { buf.push(lines[i]); i++ }
      if (i < lines.length && lines[i].startsWith("```")) i++
      appendFence(parent, lang, buf.join("\n"))
      continue
    }
    const heading = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/)
    if (heading) {
      const h = document.createElement("h" + Math.min(heading[1].length, 4))
      renderInline(h, heading[2])
      parent.append(h)
      i++
      continue
    }
    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
      parent.append(document.createElement("hr"))
      i++
      continue
    }
    if (line.trim() === "$$" || line.trim() === "\\[") {
      const end = line.trim() === "$$" ? "$$" : "\\]"
      const buf = []
      i++
      while (i < lines.length && lines[i].trim() !== end) { buf.push(lines[i]); i++ }
      if (i < lines.length) i++
      appendMath(parent, buf.join("\n").trim(), true)
      continue
    }
    const disp = line.match(/^\$\$([\s\S]+?)\$\$$/) || line.match(/^\\\[([\s\S]+?)\\\]$/)
    if (disp) { appendMath(parent, disp[1].trim(), true); i++; continue }
    if (isTableStart(lines, i)) { i = appendTable(parent, lines, i); continue }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) { i = appendList(parent, lines, i); continue }
    if (/^\s*>\s?/.test(line)) { i = appendQuote(parent, lines, i); continue }
    const buf = [line]
    i++
    while (i < lines.length && lines[i].trim() && !startsBlock(lines, i)) { buf.push(lines[i]); i++ }
    const p = document.createElement("p")
    buf.forEach((ln, k) => {
      if (k) p.append(document.createElement("br"))
      renderInline(p, ln)
    })
    parent.append(p)
  }
}

function startsBlock(lines, i) {
  const line = lines[i]
  if (line.startsWith("```")) return true
  if (/^#{1,6}\s+/.test(line)) return true
  if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) return true
  if (line.trim() === "$$" || line.trim() === "\\[") return true
  if (/^\$\$[\s\S]+\$\$$/.test(line) || /^\\\[[\s\S]+\\\]$/.test(line)) return true
  if (isTableStart(lines, i)) return true
  if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) return true
  if (/^\s*>\s?/.test(line)) return true
  return false
}

function splitRow(line) {
  let s = line.trim()
  if (s.startsWith("|")) s = s.slice(1)
  if (s.endsWith("|")) s = s.slice(0, -1)
  return s.split("|").map(c => c.trim())
}

function isSep(line) {
  const cells = splitRow(line)
  return cells.length > 1 && cells.every(c => /^:?-{3,}:?$/.test(c))
}

function isTableStart(lines, i) {
  return i + 1 < lines.length && lines[i].includes("|") && splitRow(lines[i]).length > 1 && isSep(lines[i + 1])
}

function appendTable(parent, lines, i) {
  const head = splitRow(lines[i])
  const align = splitRow(lines[i + 1]).map(c => c.startsWith(":") && c.endsWith(":") ? "center" : c.endsWith(":") ? "right" : "left")
  i += 2
  const wrap = document.createElement("div")
  wrap.className = "table-wrap"
  const table = document.createElement("table")
  const thead = document.createElement("thead")
  const hr = document.createElement("tr")
  head.forEach((cell, idx) => {
    const th = document.createElement("th")
    if (align[idx]) th.style.textAlign = align[idx]
    renderInline(th, cell)
    hr.append(th)
  })
  thead.append(hr)
  table.append(thead)
  const tb = document.createElement("tbody")
  while (i < lines.length && lines[i].trim() && lines[i].includes("|") && !isSep(lines[i])) {
    const row = splitRow(lines[i])
    const tr = document.createElement("tr")
    for (let c = 0; c < Math.max(head.length, row.length); c++) {
      const td = document.createElement("td")
      if (align[c]) td.style.textAlign = align[c]
      renderInline(td, row[c] || "")
      tr.append(td)
    }
    tb.append(tr)
    i++
  }
  table.append(tb)
  wrap.append(table)
  parent.append(wrap)
  return i
}

function appendList(parent, lines, i) {
  const ordered = /^\s*\d+[.)]\s+/.test(lines[i])
  const list = document.createElement(ordered ? "ol" : "ul")
  if (ordered) {
    const n = lines[i].match(/^\s*(\d+)/)
    if (n && n[1] !== "1") list.start = Number(n[1])
  }
  while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
    const same = ordered ? /^\s*\d+[.)]\s+/.test(lines[i]) : /^\s*[-*+]\s+/.test(lines[i])
    if (!same) break
    const li = document.createElement("li")
    renderInline(li, lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, ""))
    list.append(li)
    i++
  }
  parent.append(list)
  return i
}

function appendQuote(parent, lines, i) {
  const q = document.createElement("blockquote")
  const buf = []
  while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
    buf.push(lines[i].replace(/^\s*>\s?/, ""))
    i++
  }
  buf.forEach((ln, k) => {
    if (k) q.append(document.createElement("br"))
    renderInline(q, ln)
  })
  parent.append(q)
  return i
}

function appendFence(parent, lang, code) {
  const pre = document.createElement("pre")
  if (lang) {
    const lab = document.createElement("div")
    lab.className = "lang"
    lab.textContent = lang
    pre.append(lab)
  }
  const node = document.createElement("code")
  node.textContent = code.replace(/\n$/, "")
  pre.append(node)
  parent.append(pre)
}

function renderInline(parent, text) {
  const re = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\((.+?)\\\)|\$([^$\n]*[\\^_{}][^$\n]*)\$|!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)|\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|`([^`\n]+)`|\*\*([^*\n]+)\*\*|(?<!\*)\*([^*\n]+)\*(?!\*)|(https?:\/\/[^\s<>)\]]+)/g
  let last = 0
  let m
  while ((m = re.exec(text))) {
    if (m.index > last) parent.append(document.createTextNode(text.slice(last, m.index)))
    if (m[1] != null || m[2] != null) appendMath(parent, (m[1] || m[2]).trim(), true)
    else if (m[3] != null) appendMath(parent, m[3].trim(), false)
    else if (m[4] != null) appendMath(parent, m[4].trim(), false)
    else if (m[6]) {
      const img = document.createElement("img")
      img.className = "fig"
      img.alt = m[5] || ""
      img.src = m[6]
      parent.append(img)
    } else if (m[8]) parent.append(linkNode(m[7], m[8]))
    else if (m[9] != null) {
      const code = document.createElement("code")
      code.textContent = m[9]
      parent.append(code)
    } else if (m[10] != null) {
      const strong = document.createElement("strong")
      strong.textContent = m[10]
      parent.append(strong)
    } else if (m[11] != null) {
      const em = document.createElement("em")
      em.textContent = m[11]
      parent.append(em)
    } else if (m[12]) {
      let url = m[12]
      let tail = ""
      const cut = url.match(/^(.*?)([.,;:!?，。、）】》]+)$/)
      if (cut) { url = cut[1]; tail = cut[2] }
      parent.append(linkNode(url.replace(/^https?:\/\//, ""), url))
      if (tail) parent.append(document.createTextNode(tail))
    }
    last = m.index + m[0].length
  }
  if (last < text.length) parent.append(document.createTextNode(text.slice(last)))
}

function linkNode(label, url) {
  const a = document.createElement("a")
  a.href = url
  a.target = "_blank"
  a.rel = "noopener"
  a.textContent = label
  return a
}

function appendMath(parent, tex, display) {
  const el = document.createElement("span")
  el.className = display ? "math-block" : "math"
  if (window.katex) {
    try { katex.render(tex, el, { throwOnError: false, displayMode: display }) }
    catch (e) { el.textContent = tex }
  } else el.textContent = tex
  parent.append(el)
}

function loadKatex() {
  if (window.katex || document.getElementById("katex-css")) return
  const css = document.createElement("link")
  css.id = "katex-css"
  css.rel = "stylesheet"
  css.href = "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
  document.head.append(css)
  const s = document.createElement("script")
  s.src = "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"
  s.onload = () => renderLog()
  document.head.append(s)
}

function wireMessage(m) {
  const o = { role: m.role, content: m.content || "" }
  if (m.tool_calls) o.tool_calls = m.tool_calls
  if (m.name) o.name = m.name
  if (m.tool_call_id) o.tool_call_id = m.tool_call_id
  if (m.sources) o.sources = m.sources
  return o
}

function renderList() {
  list.replaceChildren()
  for (const c of catalog) {
    const row = document.createElement("div")
    row.className = "chat" + (current && current.id === c.id ? " on" : "")
    const title = document.createElement("span")
    title.textContent = c.title || "新对话"
    const x = document.createElement("button")
    x.type = "button"
    x.className = "x"
    x.textContent = "×"
    x.title = "删除"
    x.addEventListener("click", (ev) => { ev.stopPropagation(); remove(c.id) })
    row.append(title, x)
    row.addEventListener("click", () => open(c.id))
    list.append(row)
  }
}

async function loadCatalog() {
  const r = await fetch("/chats")
  catalog = await r.json()
  renderList()
}

async function open(id) {
  halt(false)
  const r = await fetch("/chats/" + id)
  if (!r.ok) return
  current = await r.json()
  messages = current.messages.slice()
  live = { content: "", reasoning: "", query: "" }
  renderLog()
  renderList()
}

function blank() {
  current = null
  messages = []
  live = { content: "", reasoning: "", query: "" }
  renderLog()
  renderList()
  box.focus()
}

async function remove(id) {
  halt(false)
  const r = await fetch("/chats/" + id, { method: "DELETE" })
  if (!r.ok && r.status !== 404) return
  if (current && current.id === id) blank()
  await loadCatalog()
}

function showSeat(ip) {
  seated = true
  gate.hidden = true
  who.textContent = "登录 " + ip
  const ideWho = document.getElementById("ide-who")
  if (ideWho) ideWho.textContent = ip
}

function showGate(holder, kicked) {
  seated = false
  gate.hidden = false
  who.textContent = ""
  gatewho.textContent = holder
    ? (kicked ? "你已被挤下线。当前登录：" : "当前登录：") + holder + "。输入密码后将挤掉这个用户。"
    : "还没有人登录。"
}

async function claimSeat() {
  const r = await fetch("/seat")
  const j = await r.json().catch(() => ({}))
  if (r.ok) showSeat(j.ip)
  else showGate(j.holder || "", false)
}

document.getElementById("gateform").addEventListener("submit", async (ev) => {
  ev.preventDefault()
  gateerr.textContent = ""
  const r = await fetch("/login", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ password: gatepw.value })
  })
  const j = await r.json().catch(() => ({}))
  if (!r.ok) {
    gateerr.textContent = "密码不对"
    if (j.holder) showGate(j.holder, false)
    gateerr.textContent = "密码不对"
    return
  }
  gatepw.value = ""
  showSeat(j.ip)
  await loadCatalog()
  if (catalog.length) await open(catalog[0].id)
})

setInterval(async () => {
  if (!seated) return
  const r = await fetch("/seat")
  if (r.ok) return
  const j = await r.json().catch(() => ({}))
  halt(false)
  showGate(j.holder || "", true)
}, 2000)

function newId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "")
  const bytes = new Uint8Array(16)
  crypto.getRandomValues(bytes)
  return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("")
}

function setBusy(on) {
  busy = on
  sendBtn.disabled = on
  stopBtn.disabled = !on
  box.disabled = on
}

function halt(save) {
  saveOnAbort = !!save
  if (ctrl) ctrl.abort()
  ctrl = null
}

async function save() {
  if (!current) {
    current = { id: newId(), title: "", created: Math.floor(Date.now() / 1000), messages: [] }
  }
  current.messages = messages.map(wireMessage)
  const r = await fetch("/chats/" + current.id, {
    method: "PUT",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ title: current.title, created: current.created, messages: current.messages, fold: current.fold || null })
  })
  if (!r.ok) throw new Error(await r.text())
  current = await r.json()
  await loadCatalog()
}

document.getElementById("new").addEventListener("click", () => { halt(false); blank() })

box.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) {
    ev.preventDefault()
    document.getElementById("form").requestSubmit()
  }
})

stopBtn.addEventListener("click", () => halt(true))

document.getElementById("form").addEventListener("submit", async (ev) => {
  ev.preventDefault()
  const text = box.value.trim()
  if (!text || busy) return
  box.value = ""
  messages.push({ role: "user", content: text })
  live = { content: "", reasoning: "", query: "" }
  setBusy(true)
  renderLog()
  ctrl = new AbortController()
  const signal = ctrl.signal
  try {
    const res = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "content-type": "application/json" },
      signal,
      body: JSON.stringify({
        model: "token-rush",
        temperature: Number(temp.value),
        top_p: topP,
        stream: true,
        server_tools: true,
        chat_id: current && current.id,
        fold: current && current.fold,
        messages: messages.map(wireMessage),
        chat_template_kwargs: { enable_thinking: think.checked }
      })
    })
    if (!res.ok) {
      if (res.status === 401) {
        const j = await res.json().catch(() => ({}))
        showGate((j.detail && j.detail.holder) || j.holder || "", true)
        return
      }
      throw new Error((await res.text()) || res.statusText)
    }
    const reader = res.body.getReader()
    const dec = new TextDecoder()
    let buf = ""
    while (true) {
      const step = await reader.read()
      if (step.done) break
      buf += dec.decode(step.value, { stream: true })
      const parts = buf.split("\n\n")
      buf = parts.pop()
      for (const part of parts) {
        const line = part.split("\n").find(l => l.startsWith("data:"))
        if (!line) continue
        const data = line.slice(5).trim()
        if (data === "[DONE]") continue
        const obj = JSON.parse(data)
        if (obj.error) {
          const message = obj.error.message || obj.error
          if (String(message).includes("挤下线")) {
            showGate("", true)
            return
          }
          throw new Error(message || "生成失败")
        }
        if (obj.fold) {
          if (!current) {
            current = { id: newId(), title: "", created: Math.floor(Date.now() / 1000), messages: [] }
          }
          current.fold = obj.fold
          renderLog()
          continue
        }
        if (obj.search) {
          const label = obj.search.tool === "web_fetch" ? "正在打开：" : (obj.search.tool === "recall" ? "正在查找：" : "正在搜索：")
          live.query = label + (obj.search.query || "")
          renderLog()
          continue
        }
        if (obj.tool_result) {
          messages.push({
            role: "assistant",
            content: live.content || "",
            reasoning: live.reasoning,
            tool_calls: [{
              id: obj.tool_result.tool_call_id,
              type: "function",
              function: { name: obj.tool_result.name, arguments: obj.tool_result.arguments }
            }]
          })
          messages.push({
            role: "tool",
            name: obj.tool_result.name,
            tool_call_id: obj.tool_result.tool_call_id,
            content: obj.tool_result.content,
            sources: obj.tool_result.sources || []
          })
          live = { content: "", reasoning: "", query: "" }
          renderLog()
          continue
        }
        const delta = obj.choices && obj.choices[0] && obj.choices[0].delta
        if (!delta) continue
        if (delta.reasoning_content) live.reasoning += delta.reasoning_content
        if (delta.content) live.content += delta.content
        renderLog()
      }
    }
    if (live.content || live.reasoning) messages.push({ role: "assistant", content: live.content, reasoning: live.reasoning })
    live = { content: "", reasoning: "", query: "" }
    await save()
  } catch (e) {
    if (e.name === "AbortError") {
      if (!saveOnAbort) return
      if (live.content) messages.push({ role: "assistant", content: live.content, reasoning: live.reasoning })
      live = { content: "", reasoning: "", query: "" }
      try { await save() } catch (_) {}

function langOf(path) {
  const ext = path.includes(".") ? path.split(".").pop().toLowerCase() : ""
  const map = {
    py: "python", js: "javascript", mjs: "javascript", jsx: "javascript",
    ts: "typescript", tsx: "typescript", md: "markdown", json: "json",
    html: "html", css: "css", yml: "yaml", yaml: "yaml", sh: "shell",
    rs: "rust", go: "go", c: "c", h: "c", cpp: "cpp", toml: "ini", xml: "xml"
  }
  return map[ext] || "plaintext"
}
function iconOf(name, dir) {
  if (dir) return "codicon-folder"
  const ext = name.includes(".") ? name.split(".").pop().toLowerCase() : ""
  const map = {
    py: "codicon-file-code", js: "codicon-file-code", ts: "codicon-file-code",
    jsx: "codicon-file-code", tsx: "codicon-file-code", go: "codicon-file-code",
    rs: "codicon-file-code", c: "codicon-file-code", cpp: "codicon-file-code",
    md: "codicon-markdown", json: "codicon-json", html: "codicon-file-code", css: "codicon-file-code"
  }
  return map[ext] || "codicon-file"
}

function currentText() {

function isDirty(path) {
  const base = saved.get(path)
  if (base === undefined) return false
  if (path === active) return currentText() !== base
  if (monacoEditor && window.monaco) {
    const model = monaco.editor.getModel(monaco.Uri.file(path))
    if (model) return model.getValue() !== base
  }

}

function ensureMonaco() {
  if (monacoPromise) return monacoPromise
  monacoPromise = new Promise((resolve) => {
    if (!window.require) { resolve(null); return }
    const timer = setTimeout(() => resolve(null), 8000)
    window.MonacoEnvironment = {
      getWorkerUrl: function () {
        const code = "self.MonacoEnvironment={baseUrl:'" + MONACO_VS.replace(/\/vs$/, "/") + "'};importScripts('" + MONACO_VS + "/base/worker/workerMain.js');"
        return "data:text/javascript;charset=utf-8," + encodeURIComponent(code)
      }
    }
    require.config({ paths: { vs: MONACO_VS } })
    require(["vs/editor/editor.main"], function () {
      clearTimeout(timer)
      if (monacoEditor) { resolve(monacoEditor); return }
      monacoEditor = monaco.editor.create(monacoHost, {
        value: "",
        language: "plaintext",
        theme: "vs-dark",
        automaticLayout: true,
        minimap: { enabled: true },
        fontSize: 14,
        scrollBeyondLastLine: false,
        wordWrap: "on"
      })
      monacoEditor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => saveFile())
      monacoEditor.onDidChangeModelContent(() => renderTabs())
      for (const path of openOrder) putText(path, fallbackText.get(path) ?? saved.get(path) ?? "")
      if (active) {
        const model = monaco.editor.getModel(monaco.Uri.file(active))
        if (model) monacoEditor.setModel(model)
      }
      editor.hidden = true
      monacoHost.hidden = false
      monacoEditor.layout()
      renderTabs()
      resolve(monacoEditor)
    }, function () { clearTimeout(timer); resolve(null) })
  })
  return monacoPromise
}

function stashActive() {
  if (!active || monacoEditor) return

function showTab(path) {
  stashActive()
  active = path
  if (monacoEditor && window.monaco) {
    const model = monaco.editor.getModel(monaco.Uri.file(path))
    if (model) monacoEditor.setModel(model)
  } else {
    editor.value = fallbackText.get(path) ?? saved.get(path) ?? ""
  }
  renderTabs()
  markTree()
}

function closeTab(path) {
  const i = openOrder.indexOf(path)
  if (i < 0) return
  openOrder.splice(i, 1)
  saved.delete(path)
  fallbackText.delete(path)
  if (active === path) {
    active = openOrder[i] || openOrder[i - 1] || ""
    if (active) showTab(active)
    else if (monacoEditor) monacoEditor.setModel(null)
    else editor.value = ""
  }
  if (monacoEditor && window.monaco) {
    const model = monaco.editor.getModel(monaco.Uri.file(path))
    if (model && (!monacoEditor.getModel() || monacoEditor.getModel().uri.path !== path)) model.dispose()
  }
  renderTabs()
  markTree()
}

async function drawDir(path, depth, parent) {
  let dir = dirCache.get(path)
  if (!dir) {
    dir = await fsList(path)
    dirCache.set(path, dir)
  }
  for (const ent of dir.entries) {
    const full = dir.path + "/" + ent.name
    const btn = document.createElement("button")
    btn.type = "button"
    btn.dataset.path = full
    btn.style.paddingLeft = (4 + depth * 12) + "px"
    const twist = document.createElement("i")
    twist.className = "codicon twist " + (ent.dir ? (expanded.has(full) ? "codicon-chevron-down" : "codicon-chevron-right") : "")
    const icon = document.createElement("i")
    icon.className = "codicon " + (ent.dir && expanded.has(full) ? "codicon-folder-opened" : iconOf(ent.name, ent.dir))
    btn.append(twist, icon, document.createTextNode(ent.name))
    if (full === active) btn.classList.add("on")
    btn.addEventListener("click", () => {
      if (!ent.dir) { openFile(full); return }
      if (expanded.has(full)) expanded.delete(full)
      else expanded.add(full)
      renderTree()
    })
    parent.append(btn)
    if (ent.dir && expanded.has(full)) await drawDir(full, depth + 1, parent)
  }
}

async function renderTree() {
  tree.innerHTML = ""
  if (!workspace) return
  await drawDir(workspace, 0, tree)
}

async function openWorkspace(path) {
  try {
    const dir = await fsList(path)
    if (dir.path !== workspace) {
      if (monacoEditor) monacoEditor.setModel(null)
      if (window.monaco) {
        for (const opened of openOrder) {
          const model = monaco.editor.getModel(monaco.Uri.file(opened))
          if (model) model.dispose()
        }
      }
      openOrder.splice(0)
      saved.clear()
      fallbackText.clear()
      active = ""
      if (monacoEditor) monacoEditor.setModel(null)
      else editor.value = ""
      renderTabs()
    }
    workspace = dir.path
    localStorage.setItem("tokenrush.workspace", workspace)
    dirCache.clear()
    expanded.clear()
    dirCache.set(workspace, dir)
    renderCrumbs()
    await renderTree()
  } catch (e) {
    if (path) return openWorkspace("")
    crumbs.textContent = e.message
  }
}

function putText(path, text) {
  if (monacoEditor && window.monaco) {
    let model = monaco.editor.getModel(monaco.Uri.file(path))
    if (!model) model = monaco.editor.createModel(text, langOf(path), monaco.Uri.file(path))
    else {
      if (model.getValue() !== text) model.setValue(text)
      monaco.editor.setModelLanguage(model, langOf(path))
    }
    if (path === active) monacoEditor.setModel(model)
    return
  }
  fallbackText.set(path, text)
  if (path === active) editor.value = text
}

async function openFile(path) {
  if (openOrder.includes(path)) { showTab(path); return }
  const r = await fetch("/fs/file?path=" + encodeURIComponent(path))
  const j = await r.json().catch(() => ({}))
  if (!r.ok) return
  openOrder.push(path)
  saved.set(path, j.content)
  active = path
  putText(path, j.content)
  renderTabs()
  markTree()
}

  renderTabs()
}

async function runSearch() {
  const q = document.getElementById("file-search").value.trim().toLowerCase()
  const hits = document.getElementById("search-hits")
  hits.innerHTML = ""
  if (!q || !workspace) return
  const found = []
  let calls = 0
  async function walk(path, depth) {
    if (depth > 4 || found.length >= 80 || calls >= 40) return
    calls++
    let dir = dirCache.get(path)
    if (!dir) {
      dir = await fsList(path)
      dirCache.set(path, dir)
    }
    for (const ent of dir.entries) {
      const full = dir.path + "/" + ent.name
      if (ent.name.toLowerCase().includes(q)) found.push({ full, name: ent.name, dir: ent.dir })
      if (ent.dir && found.length < 80) await walk(full, depth + 1)
    }
  }
  await walk(workspace, 0)
  for (const hit of found) {
    const btn = document.createElement("button")
    btn.type = "button"
    const icon = document.createElement("i")
    icon.className = "codicon " + iconOf(hit.name, hit.dir)
    btn.append(icon, document.createTextNode(hit.full.slice(workspace.length + 1)))
    btn.addEventListener("click", () => hit.dir ? revealDir(hit.full) : openFile(hit.full))
    hits.append(btn)
  }
}

        const key = part.replace(/\s+/g, "")
        if (key.length > 10 && seen.has(key)) { dropped = true; continue }
        if (key.length > 10) seen.add(key)
        out.push(part)
      }
      return dropped ? out.join("").trim() : ""
    }
    const paint = () => {
      const cut = repeated(answer)
      shown = cut || answer
      body.replaceChildren()
      if (shown) renderRich(body, shown)
      codeLog.scrollTop = codeLog.scrollHeight
      return !!cut
    }
    let stop = false
    while (!stop) {
      const { done, value } = await reader.read()
      if (done) break
      buf += dec.decode(value, { stream: true })
      const parts = buf.split("\n\n")
      buf = parts.pop()
      for (const part of parts) {
        const line = part.split("\n").filter(l => l.startsWith("data:")).pop()
        if (!line) continue
        const data = line.slice(5).trim()
        if (data === "[DONE]") continue
        const obj = JSON.parse(data)
        if (obj.error) throw new Error(obj.error.message || "出错了")
        const delta = obj.choices && obj.choices[0] && obj.choices[0].delta
        if (delta && delta.content) {
          answer += delta.content
          status.textContent = "正在回复"
          if (paint()) { stop = true; await reader.cancel(); break }
        }
        if (obj.tool_result) {
          const path = obj.tool_result.path || ""
          const base = path.split("/").filter(Boolean).pop() || path
          const label = obj.tool_result.name === "list_dir" ? "列出 " + path : obj.tool_result.name === "write_file" ? "写入 " + base : "读取 " + base
          const step = document.createElement("div")
          step.textContent = label
          body._steps.append(step)
          status.textContent = label
          answer = ""
          codeLog.scrollTop = codeLog.scrollHeight
        }
      }
    }
    if (!shown) {
      shown = body._steps.childElementCount ? "文件看过了，但没有写出回复。这边不能执行 git，提交要在终端里做。" : "没有收到文字"
      body.textContent = shown
    }
    codeMessages.push({ role: "assistant", content: shown })
  } catch (e) {
    body.textContent = "没有发出去：" + e.message
  } finally {
    body.parentElement.parentElement.classList.remove("live")
    codeBusy = false
    send.disabled = false
    send.classList.remove("busy")
    status.textContent = ""
  }
})
codeBox.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); document.getElementById("code-form").requestSubmit() }
})
setInterval(async () => {
  if (document.getElementById("code-row").hidden) return
  try {
    showCodeFolder()
    const r = await fetch("/ide/cites")
    if (!r.ok) return
    const data = await r.json()
    if (data.cites && data.cites.length) {
      codeCites.push(...data.cites)
      drawCode()
    }
  } catch (e) {}
}, 700)
claimSeat().then(() => { if (seated) return loadCatalog().then(() => { if (catalog.length) return open(catalog[0].id) }) })
fetch("/health").then(r => r.json()).then(h => {
  if (typeof h.top_p === "number") topP = h.top_p
  if (!localStorage.getItem("tokenrush.temperature") && typeof h.temperature === "number") {
    temp.value = String(h.temperature)
    tempv.textContent = Number(temp.value).toFixed(1)
  }
}).catch(() => {})
</script>
